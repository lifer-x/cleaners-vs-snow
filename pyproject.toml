[project]
name = "cleaners-vs-snow"
version = "1.0.0"
description = "A terminal-based simulation of cleaners fighting against snow"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "lifer-x" }
]
keywords = ["cli", "simulation", "terminal", "rich", "game"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Games/Entertainment :: Simulation"
]
dependencies = [
    "rich>=13.9.0",
]

[tool.uv]
managed = true
